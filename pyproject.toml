[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "goldsluice"
version = "0.1.3"
description = "Fast pulse-reduction kernels in Rust, with a Python mirror of every algorithm"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/villano-lab/goldsluice"
Documentation = "https://villano-lab.github.io/goldsluice/"
Repository = "https://github.com/villano-lab/goldsluice"
Changelog = "https://github.com/villano-lab/goldsluice/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest"]
# Batch mode (python -m goldsluice run) reads the dataset definition and the raw files with goldpan (goldpan.dataset, new in goldpan 0.3).
batch = ["goldpan[parquet]>=0.3"]
# The same, and the output as RQ-style ROOT files (output_format = "root" in the definition file).
root = ["goldpan[parquet,root]>=0.3"]

[tool.maturin]
python-source = "python"
module-name = "goldsluice._core"
features = ["extension-module"]
