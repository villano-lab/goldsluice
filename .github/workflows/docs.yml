name: Documentation

# The Sphinx documentation of goldsluice (sources in docs/, the reference is read from the docstrings of the Python package),
# published at https://villano-lab.github.io/goldsluice/. The Rust extension is not built: the Python mirror of each algorithm is its
# readable definition.
#
# A pull request builds it with warnings as errors, so a broken reference or a docstring Sphinx cannot read fails the check.
# A push to main (a release) builds it again and deploys it to GitHub Pages with GitHub's own Pages action: nothing is committed to a
# branch, so no bypass of the rulesets is needed. Run by hand (Actions, "Run workflow") it builds the branch it is run on and
# deploys that: use it for the first publication, or to look at develop.

on:
  pull_request:
    paths:
      - "docs/**"
      - "python/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the documentation tools and goldpan (batch mode imports it)
        run: |
          python -m pip install -r docs/requirements.txt
          python -m pip install numpy "goldpan[parquet]>=0.3"

      - name: Build (warnings are errors)
        run: python -m sphinx -b html -W --keep-going -q docs docs/_build/html

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
